name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The CLI integration tests drive the real `gh stack`; fail instead of skipping when it's missing.
      GHSTACK_REQUIRE_CLI: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the gh stack extension (tested version)
        run: |
          gh extension install github/gh-stack --pin v0.1.1
          gh stack --version

      - name: Test and build the plugin
        run: ./gradlew test buildPlugin

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: gh-stack-plugin
          path: build/distributions/*.zip
          retention-days: 14
