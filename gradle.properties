# Plugin version: bump for every release; release.yml checks it matches the v<version> tag.
pluginVersion=0.3.0

kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g

# Incremental Kotlin builds twice left tests compiled against old signatures; the project is small enough to compile fully.
kotlin.incremental=false
